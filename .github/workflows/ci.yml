name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APT_PACKAGES: >-
    tesseract-ocr tesseract-ocr-fas tesseract-ocr-ara tesseract-ocr-eng
    fonts-dejavu-core fonts-dejavu-extra fonts-freefont-ttf

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: pytest --cov --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml

  benchmark:
    name: Accuracy benchmark (synthetic)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $APT_PACKAGES
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Generate and benchmark
        run: |
          for level in easy medium; do
            idcard-ocr synth --out data/$level --count 40 --seed 2026 --difficulty $level
            idcard-ocr bench data/$level --json data/$level.json | tee -a "$GITHUB_STEP_SUMMARY"
            python scripts/check_benchmark.py data/$level.json $level
          done
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: data/*.json

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: iran-idcard-ocr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name ocr -p 8000:8000 -e IDCARD_API_KEYS=ci-key iran-idcard-ocr:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/readyz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8000/readyz
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/v1/extract)" = "401"
          docker exec ocr idcard-ocr synth --out /tmp/s --count 2 --difficulty easy
          docker logs ocr
      - name: Fails closed without credentials
        run: |
          if docker run --rm iran-idcard-ocr:ci serve; then echo "must not start without auth"; exit 1; fi
